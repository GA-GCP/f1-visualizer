# ---------------------------------------------------------------------------
# Per-environment Content-Security-Policy sources.
#
# The same nginx.conf is baked into the dev, uat and prod images (only the
# Vite bundle differs, via Dockerfile ARG ENV_MODE / cloudbuild ${_ENV}), so
# the environment is resolved per request from the Host header instead of at
# build time.  Values mirror:
#   - frontend/.env.{dev,uat,prod}                 (VITE_AUTH0_DOMAIN, VITE_API_BASE_URL)
#   - src/api/apiClient.ts, src/api/stompClient.ts (per-MODE API + /ws origins)
#   - infrastructure/environments/*/lb-frontend/   (the public frontend domain)
#
# The `default` branch is the union of all three and is what an unmatched host
# (the raw *.run.app URL, a local `docker run`, a health check) gets — looser,
# but it never silently breaks the app.
# ---------------------------------------------------------------------------

# XHR / fetch / WebSocket destinations:
#   - the API origin        -> axios REST
#   - wss:// on that origin -> the STOMP telemetry socket (/ws/websocket)
#   - the Auth0 tenant      -> POST /oauth/token from @auth0/auth0-react
map $host $csp_connect_src {
    f1visualizer.com      "https://api.f1visualizer.com wss://api.f1visualizer.com https://elysianarts.us.auth0.com";
    uat.f1visualizer.com  "https://uat.api.f1visualizer.com wss://uat.api.f1visualizer.com https://elysianarts-uat.us.auth0.com";
    dev.f1visualizer.com  "https://dev.api.f1visualizer.com wss://dev.api.f1visualizer.com https://elysianarts-dev.us.auth0.com";

    # Direct Cloud Run URLs, e.g. f1v-webapp-dev-<hash>-<region>.run.app
    ~^f1v-webapp-prod-    "https://api.f1visualizer.com wss://api.f1visualizer.com https://elysianarts.us.auth0.com";
    ~^f1v-webapp-uat-     "https://uat.api.f1visualizer.com wss://uat.api.f1visualizer.com https://elysianarts-uat.us.auth0.com";
    ~^f1v-webapp-dev-     "https://dev.api.f1visualizer.com wss://dev.api.f1visualizer.com https://elysianarts-dev.us.auth0.com";

    default               "https://api.f1visualizer.com https://uat.api.f1visualizer.com https://dev.api.f1visualizer.com wss://api.f1visualizer.com wss://uat.api.f1visualizer.com wss://dev.api.f1visualizer.com https://elysianarts.us.auth0.com https://elysianarts-uat.us.auth0.com https://elysianarts-dev.us.auth0.com";
}

# Framed documents: only the Auth0 hidden iframe (/authorize).
#
# The app uses refresh tokens with the iframe fallback disabled, so this is now
# only reachable during the initial authorization redirect. The API origin is
# deliberately not listed: nothing frames it since SockJS was removed.
map $host $csp_frame_src {
    f1visualizer.com      "https://elysianarts.us.auth0.com";
    uat.f1visualizer.com  "https://elysianarts-uat.us.auth0.com";
    dev.f1visualizer.com  "https://elysianarts-dev.us.auth0.com";

    ~^f1v-webapp-prod-    "https://elysianarts.us.auth0.com";
    ~^f1v-webapp-uat-     "https://elysianarts-uat.us.auth0.com";
    ~^f1v-webapp-dev-     "https://elysianarts-dev.us.auth0.com";

    default               "https://elysianarts.us.auth0.com https://elysianarts-uat.us.auth0.com https://elysianarts-dev.us.auth0.com";
}

# ---------------------------------------------------------------------------
# Structured access logs.
#
# The base image writes nginx's `combined` format to stdout, which Cloud
# Logging ingests as an opaque textPayload: no status field to build a
# log-based metric on, no latency, no trace correlation. Emitting the
# httpRequest shape Cloud Logging already understands makes 4xx/5xx rates and
# p95 latency on the frontend origin queryable without regex-parsing a string.
#
# `escape=json` is what keeps a crafted User-Agent or referer from breaking out
# of the JSON — without it a quote in a request header corrupts the record.
#
# The trace field is the magic key Cloud Logging correlates on; the header is
# set by the load balancer.
# ---------------------------------------------------------------------------
log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"severity":"INFO",'
    '"httpRequest":{'
        '"requestMethod":"$request_method",'
        '"requestUrl":"$scheme://$host$request_uri",'
        '"status":$status,'
        '"responseSize":"$body_bytes_sent",'
        '"userAgent":"$http_user_agent",'
        '"remoteIp":"$remote_addr",'
        '"referer":"$http_referer",'
        '"latency":"${request_time}s",'
        '"protocol":"$server_protocol"'
    '},'
    '"logging.googleapis.com/trace":"$http_x_cloud_trace_context"'
    '}';

server {
    listen 8080;
    server_name localhost;

    access_log /dev/stdout json_combined;

    # -----------------------------------------------------------------------
    # Security headers.
    #
    # NOTE: `add_header` is NOT inherited by a nested block that declares any
    # `add_header` of its own.  The static asset location below therefore
    # declares none, so it inherits this set — do not add one there without
    # also copying every directive below into it.
    # -----------------------------------------------------------------------
    #
    # style-src needs 'unsafe-inline': Emotion/MUI inject <style> elements at
    # runtime, and index.html carries one inline <style> that paints the page
    # background before the bundle runs.  Titillium Web is self-hosted via
    # @fontsource, so the build now also emits a same-origin stylesheet and
    # hashed woff2 files — both covered by 'self', and neither fonts.googleapis
    # .com nor fonts.gstatic.com is reachable any more.
    #
    # script-src stays 'self': the built index.html carries no inline script
    # (Vite emits the entry as an external module).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' $csp_connect_src; frame-src $csp_frame_src; worker-src 'self'; manifest-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=()" always;


    # -----------------------------------------------------------------------
    # Compression.
    #
    # Nothing else in the path compresses: Cloud Run does not, and the managed
    # LB only does once `compression_mode` is set (see the lb-frontend module).
    # Doing it here as well covers the raw *.run.app URL and local `docker run`.
    #
    # `gzip_proxied any` is load-bearing: GCLB adds a `Via` header to every
    # request, and nginx's default (`gzip_proxied off`) skips compression for
    # any request that carries one.  `text/html` is always compressed and must
    # not be listed in `gzip_types`.
    # -----------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      application/javascript
                    text/javascript
                    application/json
                    text/css
                    image/svg+xml
                    application/manifest+json;

    # The shell must never be served stale.  nginx emits only Last-Modified +
    # ETag for it, so browsers apply RFC 9111 heuristic freshness (~10% of the
    # file's age) — and a stale shell references hashed chunks that no longer
    # exist in the new image.  `expires -1` emits `Cache-Control: no-cache`
    # plus a past `Expires`, so it is always revalidated (ETag -> 304 when
    # unchanged).  The SPA fallback below internally redirects to /index.html,
    # which re-runs location matching, so deep links land here too.
    #
    # Deliberately NO `add_header` here — see the inheritance note above.
    location = /index.html {
        root   /usr/share/nginx/html;
        expires -1;
    }

    # Liveness and startup probe target.
    #
    # Every path used to be answered by the SPA shell with a 200, including
    # /healthz — so an uptime check passed as long as index.html existed, and
    # could not tell 'nginx up but dist missing' from healthy. An exact-match
    # location answers before any of that.
    #
    # `access_log off` because a probe every few seconds otherwise dominates the
    # log volume and inflates request counts for no information.
    #
    # `expires -1` rather than `add_header Cache-Control ...` on purpose: an
    # add_header here would stop this location inheriting the security headers
    # above (see the inheritance note), and `expires -1` emits `no-cache`
    # without touching add_header. Same reasoning as `location = /index.html`.
    location = /healthz {
        access_log off;
        expires -1;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Source maps are built ('hidden' in vite.config.ts)    # Source maps are built ('hidden' in vite.config.ts) so a production stack
    # trace can be symbolicated from an archived copy, but they are never served:
    # they contain the original TypeScript. .dockerignore keeps them out of the
    # image; this is the second lock, for any path that bypasses it — a local
    # `docker build -f Dockerfile`, or a volume mount in development.
    #
    # A regex location, so it takes precedence over the `location /` prefix
    # match below regardless of order — without it the SPA fallback would answer
    # a .map request with index.html and a 200, which is how this hides rather
    # than 404s if the rule is ever removed.
    #
    # Deliberately NO `add_header` here — see the inheritance note above.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Fallback to index.html for React Router
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    #
    # Vite emits content-hashed filenames, so a far-future expiry is safe: a
    # changed asset gets a new URL.  Unhashed files served from public/ (e.g.
    # speed-favicon.svg) inherit the same policy — acceptable, since they are
    # only referenced from index.html, which is never cached by this block.
    #
    # Deliberately NO `add_header` here: a location that declares one stops
    # inheriting the server-level security headers, which would mean keeping a
    # verbatim copy of them in sync.  `expires max` alone emits a single
    # coherent `Cache-Control: max-age=315360000` plus `Expires`.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?)$ {
        root   /usr/share/nginx/html;
        expires max;
    }
}
