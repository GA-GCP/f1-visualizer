# Automated dependency updates.
#
# --frozen-lockfile guarantees reproducibility but not freshness or safety:
# nothing was bumping transitive packages, and nothing was moving the base-image
# digests now pinned in frontend/Dockerfile. A pin with no process behind it
# goes stale, which is worse than no pin because it looks maintained.
#
# Dependabot uses a different permission model than GitHub Actions, so it is not
# affected by the "Actions is not permitted to create pull requests" setting.
#
# -----------------------------------------------------------------------------
# TEMPORARY: interval is `daily` while we confirm this config actually runs.
# -----------------------------------------------------------------------------
# It was added on a Tuesday with `interval: weekly, day: monday`, so the first
# scheduled run was six days out and the Dependabot job page had no rows — and
# therefore no per-ecosystem "Check for updates" button to press. Daily gets a
# definitive answer within 24 hours instead of an inference from an empty page.
#
# Revert to weekly once a run has appeared at
# https://github.com/GA-GCP/f1-visualizer/network/updates
# by changing each `interval: daily` back to:
#
#     interval: weekly
#     day: monday
#
# Leaving it on daily is not harmful — the grouping and the PR limits below cap
# the volume either way — but weekly is the intended cadence, and a daily poll
# on a project this size is noise for no extra signal.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Frontend npm packages.
  # ---------------------------------------------------------------------------
  # Grouped so a quiet week produces one or two PRs rather than fifteen. Majors
  # stay ungrouped and arrive individually, because those are the ones that need
  # reading rather than merging.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      # TEMPORARY — see the note at the top of this file. Revert to:
      #   interval: weekly
      #   day: monday
      interval: daily
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # ---------------------------------------------------------------------------
  # Base images in frontend/Dockerfile and frontend/Dockerfile.ci.
  # ---------------------------------------------------------------------------
  # KNOWN GAP: this does not cover cloudbuild/frontend.yaml. Dependabot's docker
  # ecosystem parses Dockerfiles, not Cloud Build step images, so the three
  # digests in the _NODE_IMAGE / _CLOUD_SDK_IMAGE / _DOCKER_IMAGE substitutions
  # have to be bumped by hand. They are declared once each precisely so that is
  # a three-line change.
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      # TEMPORARY — see the note at the top of this file. Revert to:
      #   interval: weekly
      #   day: monday
      interval: daily
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope

  # ---------------------------------------------------------------------------
  # The actions used by .github/workflows, which are pinned to commit SHAs.
  # ---------------------------------------------------------------------------
  # Pinning by SHA is what stops a tag being repointed at different code; this
  # is what keeps those SHAs from freezing at whatever they were on the day they
  # were pinned. Dependabot rewrites the SHA and the trailing version comment
  # together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # TEMPORARY — see the note at the top of this file. Revert to:
      #   interval: weekly
      #   day: monday
      interval: daily
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope

  # ---------------------------------------------------------------------------
  # Backend Maven dependencies.
  # ---------------------------------------------------------------------------
  # Nothing was bumping these: the git history shows every backend version moving
  # by hand, and Trivy only ran post-merge, so a vulnerable dependency merged
  # green. Grouped the same way as npm — patches and minors arrive together,
  # majors arrive alone because those are the ones that need reading.
  #
  # `directory: /backend` covers the whole reactor: Dependabot resolves the
  # aggregator POM and every module beneath it.
  - package-ecosystem: maven
    directory: /backend
    schedule:
      # TEMPORARY — see the note at the top of this file. Revert to:
      #   interval: weekly
      #   day: monday
      interval: daily
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # ---------------------------------------------------------------------------
  # Base images in backend/Dockerfile and backend/Dockerfile.ci.
  # ---------------------------------------------------------------------------
  # Both are now digest-pinned; this is what keeps those digests from freezing at
  # whatever they were on the day they were pinned. Same known gap as the
  # frontend: the step images in cloudbuild/backend-*.yaml are not Dockerfiles
  # and have to be bumped by hand.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      # TEMPORARY — see the note at the top of this file. Revert to:
      #   interval: weekly
      #   day: monday
      interval: daily
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope

