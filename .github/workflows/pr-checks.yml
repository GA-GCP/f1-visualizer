# ==========================================
# PR Checks — Lint, Test, Scan and Plan on Pull Requests
# ==========================================
# Runs on every PR targeting main. A `changes` job decides which areas a PR
# actually touches, and the rest gate on it — an infrastructure-only PR does not
# spend two minutes downloading a Playwright browser, and a docs-only PR does not
# build a Docker image.
#
# Every action is pinned to a commit SHA, which is what stops a moved tag running
# different code. Dependabot's github-actions ecosystem keeps them fresh.
# ==========================================
name: PR Checks

on:
  pull_request:
    branches: [main]

# Deny by default; each job grants itself the minimum it needs. A workflow-wide
# `contents: read` is inherited by every job including the ones that never check
# anything out.
permissions: {}

# A force-push to a PR branch used to leave the superseded run going: two full
# matrices competing for runners and reporting on a commit nobody is looking at
# any more.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------
  # Which areas does this PR actually touch?
  # -----------------------------------------
  # Read from the API rather than a `git diff`, so this needs no checkout and no
  # full-history fetch. Anything that matches no known area turns everything on,
  # so a new top-level file cannot silently skip a gate.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const paths = files.map((f) => f.filename);

            const AREAS = {
              backend: [/^backend\//, /^cloudbuild\/backend-service\.yaml$/],
              frontend: [/^frontend\//, /^cloudbuild\/frontend\.yaml$/],
              infrastructure: [
                /^infrastructure\//,
                /^cloudbuild\/infrastructure\.yaml$/,
                /^\.mise\.toml$/,
                /^\.pre-commit-config\.yaml$/,
              ],
              workflows: [/^\.github\//],
              // Known, but consumed by no job: a prose-only PR runs nothing, and
              // this is what keeps it from tripping the fail-open rule below.
              // A .md inside a code directory still matches that directory's
              // area, because a path may match more than one.
              docs: [/\.md$/, /^resources\//, /^LICENSE$/, /^\.gitignore$/],
            };

            const matched = (p) =>
              Object.values(AREAS).some((res) => res.some((re) => re.test(p)));

            // A path in no known area, or any change to this workflow itself, runs
            // everything. Failing open is the only safe default for a gate.
            const unknown = paths.some((p) => !matched(p));
            const workflowChanged = paths.some((p) =>
              /^\.github\/workflows\//.test(p),
            );
            const runAll = unknown || workflowChanged;

            for (const [area, res] of Object.entries(AREAS)) {
              const hit = runAll || paths.some((p) => res.some((re) => re.test(p)));
              core.setOutput(area, String(hit));
              core.info(`${area}: ${hit}`);
            }
            if (runAll) {
              core.notice(
                unknown
                  ? 'A changed path matches no known area — running every job.'
                  : 'This workflow changed — running every job.',
              );
            }

  # -----------------------------------------
  # Backend: Compile + Test all modules
  # -----------------------------------------
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the job's GITHUB_TOKEN is written into .git/config and
          # stays readable by every later step, including third-party ones.
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # `-am` is a no-op without `-pl`, and `package` stops short of `verify`,
      # which is the phase coverage, formatting and the enforcer all bind to.
      # This runs the whole reactor through verify so those actually gate a PR.
      #
      # ./mvnw, not mvn: the wrapper pins the Maven version, so CI and a
      # developer machine build with the same one (O1).
      - name: Build & Test
        run: ./mvnw -B clean verify

      # Trivy only ran in the post-merge deploy pipeline, so a dependency with a
      # known critical advisory merged green and was caught after it was already
      # on main. Scanning the source tree here catches it while the PR is open;
      # the deploy pipeline still scans the built image (S8).
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln

      # Until this existed, the Dockerfile was only ever exercised after merge, by
      # Cloud Build — so a broken Dockerfile.ci or a fresh CVE in the distroless
      # base merged green and failed on the way to an environment. This builds the
      # image production actually runs, from the layers the build above produced.
      #
      # One module is enough for what this adds: the base image and the Dockerfile
      # are identical across all five services, and the Maven dependencies of every
      # module are already covered by the filesystem scan above. Ingestion is used
      # because it has the widest dependency set.
      #
      # KNOWN GAP: backend/Dockerfile — the local multi-stage build — is not
      # exercised here. It runs a full Maven build inside the image and would cost
      # minutes on every PR. It is not the image that ships.
      - name: Build the production image
        run: |
          set -euo pipefail
          MODULE=f1v-service-data-ingestion
          STAGING=/tmp/f1v-image-staging
          mkdir -p "$STAGING"
          cd "$STAGING"
          # jarmode=tools, not layertools: Boot 4 removed the layertools jarmode.
          java -Djarmode=tools -jar "$GITHUB_WORKSPACE/backend/$MODULE/target/"*.jar \
            extract --layers --launcher --destination "$STAGING"
          docker build \
            -f "$GITHUB_WORKSPACE/backend/Dockerfile.ci" \
            -t f1v-backend:pr \
            "$STAGING"

      # Scans the runtime layers the filesystem scan cannot see: the distroless
      # base and the JDK inside it.
      #
      # ignore-unfixed, unlike the dependency scan above. The base is consumed,
      # not built here, and at the time of writing it carries six HIGH CVEs in
      # libexpat and util-linux for which Debian has shipped no patch — so
      # without this the gate would fail every PR on findings nobody can act on,
      # and would be turned off within a week. The moment a fix exists, this stops
      # ignoring it and Dependabot's docker ecosystem bumps the pinned digest.
      #
      # Our own Maven dependencies are held to the stricter standard: the scan
      # above reports unfixed advisories too, because there we can drop or replace
      # the dependency.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: f1v-backend:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

      # The SBOM the build produced, kept with the run so a later advisory can be
      # answered from what shipped rather than from what main looks like today.
      - name: Upload SBOMs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sbom
          path: backend/**/target/classes/META-INF/sbom/*.cdx.json
          if-no-files-found: warn
          retention-days: 14

  # -----------------------------------------
  # Frontend: Lint + Test
  # -----------------------------------------
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the job's GITHUB_TOKEN is written into .git/config and
          # stays readable by every later step, including third-party ones.
          persist-credentials: false

      - name: Set up Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # --frozen-lockfile guarantees reproducibility, not safety: nothing here
      # failed on a newly published advisory. Currently 0 across 764 packages,
      # so this gate goes on while it is free rather than after it is not.
      - name: Dependency audit
        run: |
          set +e
          yarn audit --level high
          code=$?
          set -e
          # yarn 1 exits with a bitmask of the severities it found:
          # 1 INFO, 2 LOW, 4 MODERATE, 8 HIGH, 16 CRITICAL. Fail on high and
          # critical (8|16 = 24) and let the rest through as a report, so a
          # low-severity advisory in a dev dependency cannot block every PR.
          if [ $((code & 24)) -ne 0 ]; then
            echo "::error::High or critical advisories found - see the audit output above"
            exit 1
          fi

      # Prettier and .editorconfig landed but nothing enforced them, so a
      # contributor whose editor does not pick up .prettierrc.json reintroduces
      # exactly the whitespace-noise diffs they were added to stop — and the
      # first anyone notices is in review. `yarn format` fixes any failure here.
      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      # A type error used to merge green and only fail later in the deploy
      # pipeline, because `yarn lint` does not typecheck and nothing built.
      - name: Typecheck
        run: yarn typecheck

      # With coverage, so the thresholds in vite.config.ts actually gate a PR.
      # They existed but ran only locally — and they earn their keep: when
      # LapTimeChart started waiting for a real measurement, functions fell to
      # 76.75% against the 77% floor, which is what revealed that the
      # ResizeObserver test mock had never called back.
      #
      # Replaces `test:ci` rather than adding a step: this runs the same suite
      # with instrumentation, about 1.5s slower.
      - name: Test with coverage
        run: yarn test:coverage

      # Catches Vite/rolldown regressions that neither lint nor tests see.
      - name: Build
        run: yarn build --mode dev

      # Bundle budget: fails the PR if the gzipped output grows past the limit
      # in frontend/.size-limit.js.
      - name: Bundle size budget
        run: yarn size

  # -----------------------------------------
  # Frontend: end-to-end against the built bundle
  # -----------------------------------------
  # The only layer that exercises the Auth0 redirect handshake, real STOMP frame
  # handling and canvas resize — everything above the component boundary is
  # mocked in the unit suite. Twelve specs across a desktop and a mobile
  # viewport, including axe at both widths.
  #
  # `needs: frontend` so it does not spend two minutes on a PR that already
  # fails lint, and so a red result here is unambiguous rather than one of
  # several simultaneous failures.
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the job's GITHUB_TOKEN is written into .git/config and
          # stays readable by every later step, including third-party ones.
          persist-credentials: false

      - name: Set up Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # The browser download is ~94 MB and dominates this job. Keyed on the
      # lockfile, so it re-downloads exactly when the Playwright version moves
      # and not otherwise.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      # Both projects are chromium (Desktop Chrome and Pixel 7), so one browser
      # covers the whole matrix.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browsers restore from cache but the OS packages they link against
      # do not, so those are installed either way.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts builds with `--mode e2e` and serves it with
      # `vite preview`, so this runs against the real rolldown output rather
      # than the dev server.
      - name: Run E2E specs
        run: yarn test:e2e

      # Without the report a red run says only that something failed. Traces
      # are written on first retry, so a flake arrives with its full timeline.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # -----------------------------------------
  # Infrastructure: static checks
  # -----------------------------------------
  # DLV-3: this job was named "Infrastructure Scan & Plan" and ran `tofu validate`
  # per module and no plan, because GitHub Actions had no GCP credentials — while
  # the README's PR table said "infrastructure plan". Formatting drift,
  # undeclared inputs and environment wiring errors like REL-2 all reached main
  # green. These four commands are what would have caught them.
  infrastructure:
    name: Infrastructure Static Checks
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.infrastructure == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the job's GITHUB_TOKEN is written into .git/config and
          # stays readable by every later step, including third-party ones.
          persist-credentials: false

      # DLV-5: the same versions .mise.toml and cloudbuild/infrastructure.yaml
      # pin, so the PR check, the plan and the apply run one toolchain.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.6'

      # DLV-2/DLV-5: the same version cloudbuild/infrastructure.yaml pins, verified
      # against the checksums published with the release. gruntwork-io's action
      # runs Terragrunt inside a container and leaves nothing on PATH, which is no
      # use to the steps below.
      - name: Install Terragrunt
        env:
          TG_VERSION: '1.1.4'
        run: |
          set -euo pipefail
          cd /tmp
          BASE="https://github.com/gruntwork-io/terragrunt/releases/download/v$TG_VERSION"
          curl -fsSL -o terragrunt_linux_amd64 "$BASE/terragrunt_linux_amd64"
          curl -fsSL -o SHA256SUMS            "$BASE/SHA256SUMS"
          grep ' terragrunt_linux_amd64$' SHA256SUMS | sha256sum -c -
          sudo install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      # Fails today on three files. `tofu fmt -recursive infrastructure/` fixes it.
      - name: Format — OpenTofu
        run: tofu fmt -check -recursive infrastructure/

      - name: Format — Terragrunt HCL
        run: terragrunt hcl fmt --check --diff --working-dir infrastructure

      # Validates the modules in isolation.
      - name: Validate modules
        run: |
          for dir in infrastructure/modules/*/; do
            echo "=== $dir ==="
            # DLV-5: readonly, so a run that would change the committed lock file
            # fails here rather than silently resolving a different provider.
            tofu -chdir="$dir" init -backend=false -lockfile=readonly
            tofu -chdir="$dir" validate
          done

      # DLV-3 / REL-12: catches an input no variable declares — which is how
      # `tier = "STANDARD_HA"` sat in the prod redis unit being silently ignored.
      - name: Validate Terragrunt inputs
        run: |
          for env in dev uat prod; do
            echo "=== $env ==="
            terragrunt hcl validate --inputs --strict \
              --working-dir "infrastructure/environments/$env" --non-interactive
          done

      # The Google ruleset is a ~40 MB download that `tflint --init` fetches on
      # every run. v6 caches both the binary and the plugin directory.
      - name: tflint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.59.1
          cache: true
          tflint_config_path: infrastructure/.tflint.hcl

      - name: tflint — modules and environments
        env:
          # Lets `tflint --init` authenticate to the GitHub API for the plugin
          # release, instead of sharing the runner's anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd infrastructure
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

      # DLV-4: the module scan cannot see the values that matter — is_public,
      # ingress, deletion_protection and every secret reference arrive as
      # Terragrunt inputs, so every security-relevant decision was invisible to
      # it. This is the fast first pass; the real one runs against a plan in
      # cloudbuild/infrastructure.yaml, where credentials exist.
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: infrastructure/.trivyignore

  # -----------------------------------------
  # Infrastructure: plan against the real project
  # -----------------------------------------
  # DLV-1: nothing planned before merge. The first real plan lived inside the
  # Cloud Build run that also applied it, seconds later — so reviewers approved
  # promotion PRs to dev, uat and prod without ever seeing what would change, and
  # destroys and replacements were discovered when they happened.
  #
  # Workload Identity Federation, so there is no service account key: the planner
  # identity holds roles/viewer and read access to the state bucket, and nothing
  # else. It cannot apply.
  #
  # Skipped on a fork PR, where the OIDC token cannot be issued.
  infrastructure-plan:
    name: Infrastructure Plan
    runs-on: ubuntu-latest
    needs: [changes, infrastructure]
    # Three conditions, and all three are about not failing for reasons that are
    # not the PR's fault:
    #
    #   - fork PRs cannot be issued an OIDC token, so `auth` would fail
    #   - WIF_PROVIDER is empty until infrastructure/platform has been applied and
    #     the repository variables set, and a red check for "not configured yet"
    #     teaches people to ignore red checks
    #   - no infrastructure changed, so there is nothing to plan
    #
    # A skipped job satisfies a required status check; a failed one does not.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.infrastructure == 'true' &&
      vars.WIF_PROVIDER != ''
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Without this the job's GITHUB_TOKEN is written into .git/config and
          # stays readable by every later step, including third-party ones.
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.6'

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLANNER_SERVICE_ACCOUNT }}

      # DLV-2/DLV-5: the same version cloudbuild/infrastructure.yaml pins, verified
      # against the checksums published with the release. gruntwork-io's action
      # runs Terragrunt inside a container and leaves nothing on PATH, which is no
      # use to the steps below.
      - name: Install Terragrunt
        env:
          TG_VERSION: '1.1.4'
        run: |
          set -euo pipefail
          cd /tmp
          BASE="https://github.com/gruntwork-io/terragrunt/releases/download/v$TG_VERSION"
          curl -fsSL -o terragrunt_linux_amd64 "$BASE/terragrunt_linux_amd64"
          curl -fsSL -o SHA256SUMS            "$BASE/SHA256SUMS"
          grep ' terragrunt_linux_amd64$' SHA256SUMS | sha256sum -c -
          sudo install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Plan
        id: plan
        env:
          TG_NON_INTERACTIVE: 'true'
          # Through the environment rather than interpolated into the script.
          # This value is a matrix key we control, so it is not an injection risk
          # today — but a `${{ }}` inside a run block is the shape of one, and
          # the pattern costs nothing.
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          cd "infrastructure/environments/$ENVIRONMENT"
          terragrunt run --all --parallelism 4 -- init -lockfile=readonly
          terragrunt run --all --parallelism 4 -- plan -no-color 2>&1 | tee /tmp/plan.txt

      # A plan nobody reads is the problem this solves, so it goes on the PR
      # rather than into a log a reviewer has to go looking for.
      #
      # Updated in place rather than appended: a PR with six pushes used to end
      # up with eighteen plan comments, and the newest one is the only one that
      # is true.
      - name: Comment the plan
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terragrunt-plan:${env} -->`;

            let body;
            try {
              const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
              // A full run --all plan can exceed the 65536-byte comment limit.
              const trimmed =
                plan.length > 60000
                  ? plan.slice(0, 30000) +
                    '\n\n...trimmed, see the job log...\n\n' +
                    plan.slice(-30000)
                  : plan;
              body =
                `${marker}\n### Terragrunt plan — \`${env}\`\n\n` +
                `<details><summary>Show plan</summary>\n\n` +
                '```terraform\n' + trimmed + '\n```\n\n</details>';
            } catch {
              body =
                `${marker}\n### Terragrunt plan — \`${env}\`\n\n` +
                'The plan step produced no output. See the job log.';
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find((c) => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # -----------------------------------------
  # Semgrep — cross-language static analysis
  # -----------------------------------------
  # Two halves. The custom rules under .semgrep/ encode invariants specific to
  # this codebase — every BigQuery query goes through the guarded runner, CORS is
  # configured once, Auth0 config is read in one module, no project-level data
  # role. Nothing off the shelf knows those, and each one is a finding from the
  # 2026-09-08 or 2026-09-09 audit that could otherwise regress silently.
  #
  # The community rulesets are the second half: the usual Java, TypeScript,
  # React, Terraform and Dockerfile checks, which overlap SpotBugs and ESLint in
  # places and are cheap enough not to mind.
  #
  # Diff-aware: --baseline-commit means only findings the PR introduces fail it.
  # Pre-existing findings are reported by the weekly full scan
  # (semgrep-scheduled.yml) and do not block anyone's unrelated change.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      ${{ needs.changes.outputs.backend == 'true' ||
          needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.infrastructure == 'true' ||
          needs.changes.outputs.workflows == 'true' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --baseline-commit needs the base commit to exist locally.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Semgrep
        env:
          SEMGREP_VERSION: 1.176.1
        run: |
          set -euo pipefail
          pipx install "semgrep==$SEMGREP_VERSION"
          semgrep --version

      # The rules before the code. A rule that no longer matches what it claims
      # to match finds nothing and passes silently, which is worse than failing.
      - name: Test the rules
        run: semgrep --test --metrics=off .semgrep

      - name: Scan
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # --metrics=off: the default sends usage telemetry to semgrep.dev when
          # registry rules are used. Findings never leave the runner either way,
          # but a private repo should not be reporting what it scans.
          SEMGREP_SEND_METRICS: 'off'
        run: |
          set -uo pipefail
          semgrep scan \
            --config=.semgrep \
            --config=p/default \
            --config=p/java \
            --config=p/typescript \
            --config=p/react \
            --config=p/terraform \
            --config=p/dockerfile \
            --exclude-rule=package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown \
            --baseline-commit="$BASE_SHA" \
            --metrics=off \
            --error \
            --json --output=semgrep.json \
            --text
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Comment the findings
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- semgrep -->';

            let results = [];
            try {
              results = JSON.parse(fs.readFileSync('semgrep.json', 'utf8')).results ?? [];
            } catch {
              // No output file means the scan itself failed; the job log has why.
            }

            let body;
            if (results.length === 0) {
              body = `${marker}\n### Semgrep\n\nNo new findings introduced by this PR.`;
            } else {
              const rows = results
                .slice(0, 50)
                .map((r) => {
                  const rule = r.check_id.split('.').pop();
                  const sev = r.extra.severity;
                  const msg = r.extra.message.trim().split('\n')[0].slice(0, 160);
                  return `| \`${r.path}:${r.start.line}\` | ${sev} | \`${rule}\` | ${msg} |`;
                })
                .join('\n');
              const more =
                results.length > 50 ? `\n\n…and ${results.length - 50} more; see the job log.` : '';
              body =
                `${marker}\n### Semgrep — ${results.length} new finding(s)\n\n` +
                `These are introduced by this PR; pre-existing findings are not shown.\n\n` +
                `| Location | Severity | Rule | What to do |\n|---|---|---|---|\n${rows}${more}`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (results.length > 0) {
              // Do not open a comment thread just to say "nothing found".
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload the full report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-findings
          path: semgrep.json
          if-no-files-found: ignore
          retention-days: 14

  # -----------------------------------------
  # The workflows themselves
  # -----------------------------------------
  # This file is now several hundred lines with a lot of shell in it, and nothing
  # checked any of it. actionlint parses every `run:` block with shellcheck and
  # validates every ${{ }} expression against the real context schema — it catches
  # an unquoted variable or a typo'd `needs.` reference before a PR does.
  #
  # zizmor is the security half: template injection, over-broad permissions,
  # unpinned actions, credential persistence. Everything it looks for is
  # deliberately already true here, which is exactly why it is worth a gate.
  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloaded and checksum-verified rather than run as an action, so this
      # job adds no new action to the supply chain it is here to check.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          cd /tmp
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          # -O, not -o: the checksum file names the release artifact, so the
          # local filename has to match it for `sha256sum -c` to find it.
          curl -fsSL -O "$BASE/$TARBALL"
          curl -fsSL -O "$BASE/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${TARBALL}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$TARBALL" actionlint
          cd "$GITHUB_WORKSPACE"
          /tmp/actionlint -color

      # Version-pinned rather than checksum-verified, unlike actionlint above:
      # zizmor publishes no checksum file with its releases, so PyPI's pinned
      # version is the available trust anchor. pinned-versions.yml watches both,
      # so neither pin goes stale unnoticed.
      - name: zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pipx install "zizmor==$ZIZMOR_VERSION"
          zizmor --persona=regular --min-severity=medium --no-progress .github/workflows
