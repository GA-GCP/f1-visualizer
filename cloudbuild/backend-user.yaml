# ==========================================
# Pipeline: f1v-service-user
# ==========================================
# Scoped build + test, layer extraction, security scan,
# Kaniko cached image build, and Cloud Run deployment.
# ==========================================
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/sa-f1v-cloudbuild-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com'

substitutions:
  _ENV: 'dev'
  _SHORT_SHA: 'manual-build'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Scoped Maven Build + Test (only this module and its dependencies)
  - name: 'maven:3.9.16-eclipse-temurin-25'
    id: 'build-and-test'
    entrypoint: 'mvn'
    args:
      - 'clean'
      - 'package'
      - '-pl'
      - 'f1v-service-user'
      - '-am'
    dir: 'backend'

  # 2. Extract Spring Boot JAR Layers
  - name: 'eclipse-temurin:25-jdk'
    id: 'extract-layers'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        mkdir -p /workspace/staging
        cd /workspace/staging
        java -Djarmode=layertools -jar /workspace/backend/f1v-service-user/target/*.jar extract

  # 3. Trivy Filesystem Security Scan
  - name: 'aquasec/trivy:0.74.0'
    id: 'security-scan'
    args:
      - 'filesystem'
      - '--exit-code'
      - '1'
      - '--severity'
      - 'CRITICAL,HIGH'
      - '--no-progress'
      - '/workspace/staging'

  # 4. Docker Build + Push (registry layer cache)
  #    Kaniko was archived upstream; this uses the maintained Cloud Build
  #    docker builder, seeding the cache from the previous :latest image.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-push-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/f1v-repo/user"

        # A cold cache is not an error on the first build.
        docker pull "$$IMAGE:latest" || true

        docker build \
          --cache-from "$$IMAGE:latest" \
          -f /workspace/backend/Dockerfile.ci \
          -t "$$IMAGE:${_SHORT_SHA}" \
          -t "$$IMAGE:latest" \
          /workspace/staging

        docker push "$$IMAGE:${_SHORT_SHA}"
        docker push "$$IMAGE:latest"

  # 5. Deploy to Cloud Run (immutable SHA tag)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:583.0.0'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'f1v-service-user-${_ENV}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/f1v-repo/user:${_SHORT_SHA}'
      - '--region=${_REGION}'
      - '--project=$PROJECT_ID'
      - '--quiet'
