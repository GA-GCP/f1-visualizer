# pnpm's settings for this package. There is no workspace: pnpm reads its
# project settings from this file, and the dependency overrides that were
# `resolutions` in package.json are `overrides` here.

# Which dependencies may run install scripts. pnpm runs none it has not been
# told about, and fails the install on any it finds that this list does not
# mention, so a new script in a dependency update is a decision, not a surprise.
#
# - canvas: builds its native addon (or fetches the prebuilt one) for the
#   visual-regression tests. Without it every snapshot test fails to load.
# - browser-tabs-lock (through @auth0/auth0-spa-js): prints a thank-you banner.
# - unrs-resolver (through eslint-import-resolver-typescript): repairs a
#   missing native binding. pnpm installs the right binding as an optional
#   dependency, so there is nothing to repair.
allowBuilds:
  browser-tabs-lock: false
  canvas: true
  unrs-resolver: false

# pnpm refuses any version published less than a day ago (minimumReleaseAge),
# lockfile or not. These are exempt by exact version only: rolldown 1.2.18
# came in with the vite bump merged on 2026-11-10, while still under a day old.
# Every other package, and any other rolldown version, stays covered. From
# 2026-11-10T10:07Z this list does nothing and can go.
minimumReleaseAgeExclude:
  - rolldown@1.2.18
  - '@rolldown/binding-android-arm-eabi@1.2.18'
  - '@rolldown/binding-android-arm64@1.2.18'
  - '@rolldown/binding-darwin-arm64@1.2.18'
  - '@rolldown/binding-darwin-x64@1.2.18'
  - '@rolldown/binding-freebsd-x64@1.2.18'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.18'
  - '@rolldown/binding-linux-arm64-gnu@1.2.18'
  - '@rolldown/binding-linux-arm64-musl@1.2.18'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.18'
  - '@rolldown/binding-linux-s390x-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-musl@1.2.18'
  - '@rolldown/binding-openharmony-arm64@1.2.18'
  - '@rolldown/binding-win32-arm64-msvc@1.2.18'
  - '@rolldown/binding-win32-x64-msvc@1.2.18'

# `parent>child` pins `child` only where `parent` depends on it.
#
# The minimatch entries keep every copy of minimatch at 11.0.1 or above, out of
# GHSA-g3hv-75wg-m249. Three consumers cannot take minimatch 11 as is and get
# the shim in shims/minimatch-compat instead; its README says why and when this
# can go.
overrides:
  vite: ^8.3.6
  micromatch>picomatch: ^2.3.2
  eslint>minimatch: ^11.0.3
  '@eslint/config-array>minimatch': ^11.0.3
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.3
  eslint-plugin-import-x>minimatch: file:./shims/minimatch-compat
  eslint-plugin-jsx-a11y>minimatch: file:./shims/minimatch-compat
  eslint-plugin-react>minimatch: file:./shims/minimatch-compat
