server:
  port: 8083
spring:
  cloud:
    gcp:
      firestore:
        # Your own project, from the environment; the default is a placeholder.
        project-id: ${GOOGLE_CLOUD_PROJECT:f1v-example-project}
        database-id: (default)
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri, not jwk-set-uri: the latter validates the signature
          # but never checks who issued the token (C6).
          issuer-uri: https://elysianarts-dev.us.auth0.com/
          audiences: dev.api.f1visualizer.com

f1v:
  cors:
    allowed-origins: http://localhost:5173,https://f1visualizer.com,https://*.f1visualizer.com
