server:
  port: 8084
spring:
  data:
    redis:
      # A local Redis has no certificate.
      ssl:
        enabled: false
  cloud:
    gcp:
      firestore:
        project-id: f1v-example-project
        database-id: f1v-db-dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://elysianarts-dev.us.auth0.com/
          audiences: dev.api.f1visualizer.com

f1v:
  cors:
    allowed-origins: http://localhost:5173,https://f1visualizer.com,https://*.f1visualizer.com
