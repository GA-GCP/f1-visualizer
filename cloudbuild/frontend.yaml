# ==========================================
# Pipeline: f1v-webapp (React Frontend)
# ==========================================
# Install, lint, test, build in Cloud Build, then
# Kaniko cached image build and Cloud Run deployment.
# ==========================================
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/sa-f1v-deploy-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com'

substitutions:
  _ENV: 'dev'
  # Kept as a default so `gcloud builds submit` still parses, but the guard step
  # below refuses to build with it: deploying it would overwrite a mutable
  # :manual-build tag that the deploy step assumes is immutable.
  _SHORT_SHA: 'manual-build'
  _REGION: 'us-central1'
  # Optional. When set, hidden source maps are archived here keyed by version so
  # a production stack trace can be symbolicated. Empty means skip the upload —
  # the maps are still built, just not kept.
  _SOURCEMAP_BUCKET: ''
  # Builder images, pinned by digest and declared once rather than repeated
  # across ten steps. Unpinned, `node:26-alpine` tracked every 26.x patch and
  # every Alpine bump, and `gcr.io/cloud-builders/docker` had no tag at all —
  # so two builds of the same commit could compile the canvas addon against a
  # different musl and push with a different docker client, with no diff in
  # this repo to bisect. The --cache-from layer cache also cannot hit when the
  # base moves underneath it.
  #
  # The tag is kept next to the digest for readability; the digest resolves.
  _NODE_IMAGE: 'node:26.8.2-alpine3.24@sha256:ef24c5053d50fdc3e4e56eb4e7ddb7861874ab0fdc797046ba897581deb8e868'
  _CLOUD_SDK_IMAGE: 'gcr.io/google.com/cloudsdktool/cloud-sdk:584.0.0@sha256:bc341c1215dfd18be9cab1dcf1321d583865225fae3e37f4b1ac1a5fdb392262'
  # Scans the built image before any traffic reaches it. Pinned like the rest.
  _TRIVY_IMAGE: 'aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
  # Digest only: this image is published without a meaningful version tag.
  _DOCKER_IMAGE: 'gcr.io/cloud-builders/docker@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 0. Refuse a build that cannot be identified.
  #    _SHORT_SHA defaults to the literal 'manual-build', and every manually
  #    triggered build used to push that same tag — so :manual-build moved,
  #    while step 6 deploys by tag on the assumption that it does not. An
  #    unidentifiable build is also one no one can map an error report back to.
  - name: '${_CLOUD_SDK_IMAGE}'
    id: 'verify-version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_SHORT_SHA}" = "manual-build" ]; then
          echo "ERROR: _SHORT_SHA is still the default 'manual-build'."
          echo "Pass one explicitly: --substitutions=_SHORT_SHA=<short-sha>"
          exit 1
        fi
        echo "Building version ${_SHORT_SHA} for ${_ENV}"

  # 1. Install Dependencies
  #    canvas (node-canvas) is a native C++ addon used by visual-regression
  #    tests. Alpine needs Python, a C++ toolchain, and Cairo/Pango libs
  #    for node-gyp to compile it.
  - name: '${_NODE_IMAGE}'
    id: 'install'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache python3 make g++ pkgconf \
          cairo-dev pango-dev libjpeg-turbo-dev giflib-dev librsvg-dev \
        && yarn install --frozen-lockfile
    dir: 'frontend'

  # 2. ESLint Check
  - name: '${_NODE_IMAGE}'
    id: 'lint'
    entrypoint: 'yarn'
    args: ['lint']
    dir: 'frontend'

  # 3. Unit Tests
  #    canvas runtime libs needed for visual-regression tests (the compiled
  #    .node addon from step 1 links against cairo/pango shared libs).
  - name: '${_NODE_IMAGE}'
    id: 'test'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache cairo pango libjpeg-turbo giflib librsvg \
        && yarn test:ci
    dir: 'frontend'
    # Without CI set, jest-image-snapshot silently WRITES a missing baseline
    # and passes, so a visual regression could never fail this pipeline.
    env: ['CI=true']

  # 4. Production Build (produces dist/)
  - name: '${_NODE_IMAGE}'
    id: 'build'
    entrypoint: 'yarn'
    args: ['build', '--mode', '${_ENV}']
    dir: 'frontend'
    # Read by `define` in vite.config.ts. Without it the bundle reports
    # itself as 'local' and nothing in the served page says which build it is.
    env: ['APP_VERSION=${_SHORT_SHA}']

  # 4b. Archive the hidden source maps, then leave them behind.
  #     vite emits them without a sourceMappingURL comment, so browsers never
  #     request them; .dockerignore keeps them out of the image. Archiving is
  #     what makes them useful — without a copy keyed by version, a minified
  #     production stack trace stays unreadable.
  - name: '${_CLOUD_SDK_IMAGE}'
    id: 'archive-sourcemaps'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -z "${_SOURCEMAP_BUCKET}" ]; then
          echo "No _SOURCEMAP_BUCKET set; source maps built but not archived."
          exit 0
        fi
        gcloud storage cp frontend/dist/assets/*.map \
          "gs://${_SOURCEMAP_BUCKET}/frontend/${_ENV}/${_SHORT_SHA}/"
        echo "Archived to gs://${_SOURCEMAP_BUCKET}/frontend/${_ENV}/${_SHORT_SHA}/"

  # 5. Docker Build + Push (registry layer cache)
  #    Kaniko was archived upstream; this uses the maintained Cloud Build
  #    docker builder, seeding the cache from the previous env image.
  - name: '${_DOCKER_IMAGE}'
    id: 'build-push-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/f1v-repo/frontend"

        # A cold cache is not an error on the first build.
        docker pull "$$IMAGE:latest-${_ENV}" || true

        docker build \
          --cache-from "$$IMAGE:latest-${_ENV}" \
          -f /workspace/frontend/Dockerfile.ci \
          -t "$$IMAGE:${_SHORT_SHA}" \
          -t "$$IMAGE:latest-${_ENV}" \
          /workspace/frontend

        docker push "$$IMAGE:${_SHORT_SHA}"
        docker push "$$IMAGE:latest-${_ENV}"

  # 5b. Scan the image that was just built.
  #     pr-checks.yml runs Trivy in `config` mode over infrastructure/modules —
  #     it has never looked at the artifact that actually runs. Pinning the base
  #     image by digest made it reproducible; it says nothing about whether it
  #     is safe.
  #
  #     Runs through the docker builder so trivy can reach the daemon and scan
  #     layers already present locally, rather than pulling from Artifact
  #     Registry and needing credentials of its own.
  #
  #     --ignore-unfixed on purpose: an Alpine base carries CVEs with no fixed
  #     version available, and a gate that fails on those gets switched off
  #     within a month. HIGH and CRITICAL *with a fix* is the actionable set.
  #
  #     Placed after the push and before the deploy. The image exists in the
  #     registry at this point but no revision serves it, so a failure here
  #     costs an unused tag rather than a rollback.
  - name: '${_DOCKER_IMAGE}'
    id: 'scan-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/f1v-repo/frontend:${_SHORT_SHA}"

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v /workspace/.trivycache:/root/.cache \
          ${_TRIVY_IMAGE} image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --scanners vuln \
            "$$IMAGE"

        echo "No fixable HIGH or CRITICAL vulnerabilities in $$IMAGE"

  # 6. Deploy the new revision WITHOUT traffic.
  #     `gcloud run services update` used to shift 100% of traffic the moment
  #     the revision passed Cloud Run's default TCP probe — which only proves
  #     nginx bound a port. A build that produced an empty or half-copied dist/
  #     reached every user instantly, and recovery was a console action.
  #
  #     Deploying with --no-traffic makes the next two steps a real gate: if the
  #     smoke test fails the build stops here and no user ever sees this
  #     revision, so the rollback is 'do nothing' rather than a manual undo.
  #     --tag gives the revision its own URL to be tested on.
  - name: '${_CLOUD_SDK_IMAGE}'
    id: 'deploy-no-traffic'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'f1v-webapp-${_ENV}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/f1v-repo/frontend:${_SHORT_SHA}'
      - '--tag=sha-${_SHORT_SHA}'
      - '--no-traffic'
      - '--region=${_REGION}'
      - '--project=$PROJECT_ID'
      - '--quiet'

  # 7. Smoke test the revision on its tag URL, before it serves anyone.
  - name: '${_CLOUD_SDK_IMAGE}'
    id: 'smoke'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        # The tag URL is only in the service's traffic list. Parsed with python3
        # (which ships in this image, gcloud is written in it) rather than a
        # --format expression, because the filter syntax for a tagged entry is
        # easy to get subtly wrong and fail open.
        TAG_URL=$(gcloud run services describe f1v-webapp-${_ENV} \
          --region=${_REGION} --project=$PROJECT_ID --format=json \
          | python3 -c "import json,sys; print(next(t['url'] for t in json.load(sys.stdin)['status']['traffic'] if t.get('tag') == 'sha-${_SHORT_SHA}'))")

        echo "Smoke testing $$TAG_URL"

        # 1. The health endpoint answers with exactly 'ok'.
        #    This is the strongest single check available: before nginx.conf
        #    grew a /healthz location, ANY path returned the SPA shell with a
        #    200 — so 'ok' proves the new config is really in the image, not
        #    just that index.html exists.
        test "$(curl -fsS "$$TAG_URL/healthz")" = "ok"

        # 2. The app shell is served and has a mount point. An empty or
        #    half-copied dist/ fails here.
        curl -fsS "$$TAG_URL/" | grep -q '<div id="root">'

        # 3. A deep link still falls back to the shell rather than 404ing.
        curl -fsS "$$TAG_URL/dashboard" | grep -q '<div id="root">'

        # 4. The security headers survived. These are set in nginx.conf and are
        #    exactly the kind of thing that silently disappears when a location
        #    block is edited — see the add_header inheritance note in that file.
        curl -fsSI "$$TAG_URL/" | grep -qi '^content-security-policy:'

        # 5. The revision serving this URL is the one we just built. Vite stamps
        #    APP_VERSION into <meta name="version">, so this catches a stale
        #    image, a cache-hit that reused an older layer, or a tag pointing
        #    somewhere unexpected — none of which the checks above would notice,
        #    because a previous good build passes all of them.
        curl -fsS "$$TAG_URL/" | grep -q '<meta name="version" content="${_SHORT_SHA}">'

        echo "Smoke test passed for sha-${_SHORT_SHA}"

  # 8. Promote: send 100% of traffic to the revision that just passed.
  #     Pinned by tag rather than --to-latest, so traffic points at this exact
  #     revision instead of following whatever becomes latest — a later
  #     terragrunt apply cannot silently shift users onto a different image.
  - name: '${_CLOUD_SDK_IMAGE}'
    id: 'promote'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'f1v-webapp-${_ENV}'
      - '--to-tags=sha-${_SHORT_SHA}=100'
      - '--region=${_REGION}'
      - '--project=$PROJECT_ID'
      - '--quiet'
