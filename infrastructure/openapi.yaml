swagger: '2.0'
info:
  title: F1 Visualizer API
  description: The central API Gateway routing traffic to F1V microservices.
  version: 1.0.0
host: "API_GATEWAY_HOST_PLACEHOLDER"
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json

# ==============================================================================
# NOTES ON WHAT IS AND IS NOT HERE
# ==============================================================================
# No OPTIONS routes. The load balancer's URL map answers preflight directly with
# a 204 and never forwards it here, so the ~40 OPTIONS blocks this file used to
# carry were dead weight that still had to be kept in step with every route
# change (S7).
#
# Every backend runs with `disable_auth: false` and a `jwt_audience`, so the
# gateway mints an ID token for its own service account and Cloud Run rejects
# anything that did not come through it. That is what lets the REST services drop
# their `allUsers` invoker binding, which previously made the gateway's quotas and
# the LB's edge CORS handling optional — the *.run.app URLs answered straight from
# the internet (S3). The services still validate the Auth0 JWT themselves; this is
# defence in depth, not a replacement.
#
# `jwt_audience` is the Cloud Run service URL, so it resolves from the same
# placeholder as `address`.
# ==============================================================================

securityDefinitions:
  auth0_jwt:
    authorizationUrl: "AUTH0_ISSUER_URI_PLACEHOLDER/authorize"
    flow: "implicit"
    type: "oauth2"
    x-google-issuer: "AUTH0_ISSUER_URI_PLACEHOLDER/"
    x-google-jwks_uri: "AUTH0_ISSUER_URI_PLACEHOLDER/.well-known/jwks.json"
    x-google-audiences: "AUTH0_AUDIENCE_PLACEHOLDER"
    x-google-forward-auth-header: true
    # Declared so the spec states which operations are administrative, and
    # matched by `hasAuthority("ingest:admin")` in the ingestion service.
    #
    # API Gateway does not itself enforce OAuth scopes, so this documents the
    # contract rather than gating at the edge: the service is the enforcement
    # point (S1). Auth0 must have this permission defined on the API with RBAC
    # and "Add Permissions in the Access Token" enabled for the claim to arrive.
    scopes:
      ingest:admin: Load reference and historical data, and switch ingestion mode

paths:
  # --- USER SERVICE ---

  /api/v1/users/me:
    get:
      summary: Get Current User
      operationId: getUser
      x-google-backend:
        address: USER_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: USER_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/users/me/preferences:
    put:
      summary: Update Preferences
      operationId: updateUserPrefs
      x-google-backend:
        address: USER_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: USER_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  # --- ANALYSIS SERVICE ---

  /api/v1/analysis/session/{sessionKey}/laps:
    get:
      summary: Get Laps
      operationId: getLaps
      parameters:
        - name: sessionKey
          in: path
          required: true
          type: string
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/analysis/sessions:
    get:
      summary: Get Sessions
      operationId: getSessions
      parameters:
        - name: year
          in: query
          required: false
          type: integer
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/analysis/drivers:
    get:
      summary: Get Drivers
      operationId: getDrivers
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/analysis/sessions/search:
    get:
      summary: Search Sessions
      operationId: searchSessions
      parameters:
        - name: query
          in: query
          required: false
          type: string
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/analysis/drivers/{driverId}/stats:
    get:
      summary: Get Driver Stats
      operationId: getDriverStats
      parameters:
        - name: driverId
          in: path
          required: true
          type: integer
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/analysis/sessions/{sessionKey}/drivers:
    get:
      summary: Get Session Drivers
      operationId: getSessionDrivers
      parameters:
        - name: sessionKey
          in: path
          required: true
          type: integer
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/analysis/years:
    get:
      summary: Get Available Years
      operationId: getAvailableYears
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/analysis/sessions/year/{year}:
    get:
      summary: Get Sessions By Year
      operationId: getSessionsByYear
      parameters:
        - name: year
          in: path
          required: true
          type: integer
      x-google-backend:
        address: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_ANALYSIS_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  # --- INGESTION SERVICE ---

  # The three administrative operations below require the ingest:admin
  # permission; playback is open to any authenticated user and rate-limited
  # in the service (S1).

  /api/v1/ingestion/command:
    post:
      summary: Issue Ingestion Command
      operationId: ingestionCommand
      x-google-backend:
        address: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: [ingest:admin]

  /api/v1/ingestion/load-historical:
    post:
      summary: Start Historical Load
      operationId: loadHistorical
      parameters:
        - name: sessionKey
          in: query
          required: true
          type: integer
      x-google-backend:
        address: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: [ingest:admin]

  /api/v1/ingestion/load-reference:
    post:
      summary: Start Reference Load
      operationId: loadReference
      parameters:
        - name: year
          in: query
          required: true
          type: integer
      x-google-backend:
        address: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: [ingest:admin]

  /api/v1/ingestion/jobs/{jobId}:
    get:
      summary: Get Ingestion Job Status
      operationId: getIngestionJob
      parameters:
        - name: jobId
          in: path
          required: true
          type: string
      x-google-backend:
        address: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: [ingest:admin]

  /api/v1/ingestion/playback/play:
    post:
      summary: Resume Playback
      operationId: playSimulation
      x-google-backend:
        address: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/ingestion/playback/pause:
    post:
      summary: Pause Playback
      operationId: pauseSimulation
      x-google-backend:
        address: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []

  /api/v1/ingestion/playback/seek:
    post:
      summary: Seek Playback
      operationId: seekSimulation
      parameters:
        - name: percentage
          in: query
          required: true
          type: integer
      x-google-backend:
        address: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 60.0
        disable_auth: false
        jwt_audience: DATA_INGESTION_SERVICE_URL_PLACEHOLDER
      responses:
        '200':
          description: OK
      security:
        - auth0_jwt: []
