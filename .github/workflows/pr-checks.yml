# ==========================================
# PR Checks — Lint, Test, and Plan on Pull Requests
# ==========================================
# Runs on every PR targeting main. Three independent jobs
# execute in parallel: backend tests, frontend lint+test,
# and infrastructure plan.
# ==========================================
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------
  # Backend: Compile + Test all modules
  # -----------------------------------------
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: mvn clean package -am

  # -----------------------------------------
  # Frontend: Lint + Test
  # -----------------------------------------
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # A type error used to merge green and only fail later in the deploy
      # pipeline, because `yarn lint` does not typecheck and nothing built.
      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:ci

      # Catches Vite/rolldown regressions that neither lint nor tests see.
      - name: Build
        run: yarn build --mode dev

      # Bundle budget: fails the PR if the gzipped output grows past the limit
      # in frontend/.size-limit.json.
      - name: Bundle size budget
        run: yarn size

  # -----------------------------------------
  # Infrastructure: Security Scan + Plan
  # -----------------------------------------
  infrastructure:
    name: Infrastructure Scan & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.6'

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/modules
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Validate OpenTofu Modules
        run: |
          for dir in infrastructure/modules/*/; do
            echo "=== Validating $dir ==="
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
          done
