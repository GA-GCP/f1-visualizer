# ==========================================
# Pipeline: f1v-webapp (React Frontend)
# ==========================================
# Install, lint, test, build in Cloud Build, then
# Kaniko cached image build and Cloud Run deployment.
# ==========================================
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/sa-f1v-cloudbuild-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com'

substitutions:
  _ENV: 'dev'
  # Kept as a default so `gcloud builds submit` still parses, but the guard step
  # below refuses to build with it: deploying it would overwrite a mutable
  # :manual-build tag that the deploy step assumes is immutable.
  _SHORT_SHA: 'manual-build'
  _REGION: 'us-central1'
  # Optional. When set, hidden source maps are archived here keyed by version so
  # a production stack trace can be symbolicated. Empty means skip the upload —
  # the maps are still built, just not kept.
  _SOURCEMAP_BUCKET: ''

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 0. Refuse a build that cannot be identified.
  #    _SHORT_SHA defaults to the literal 'manual-build', and every manually
  #    triggered build used to push that same tag — so :manual-build moved,
  #    while step 6 deploys by tag on the assumption that it does not. An
  #    unidentifiable build is also one no one can map an error report back to.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:583.0.0'
    id: 'verify-version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_SHORT_SHA}" = "manual-build" ]; then
          echo "ERROR: _SHORT_SHA is still the default 'manual-build'."
          echo "Pass one explicitly: --substitutions=_SHORT_SHA=<short-sha>"
          exit 1
        fi
        echo "Building version ${_SHORT_SHA} for ${_ENV}"

  # 1. Install Dependencies
  #    canvas (node-canvas) is a native C++ addon used by visual-regression
  #    tests. Alpine needs Python, a C++ toolchain, and Cairo/Pango libs
  #    for node-gyp to compile it.
  - name: 'node:26-alpine'
    id: 'install'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache python3 make g++ pkgconf \
          cairo-dev pango-dev libjpeg-turbo-dev giflib-dev librsvg-dev \
        && yarn install --frozen-lockfile
    dir: 'frontend'

  # 2. ESLint Check
  - name: 'node:26-alpine'
    id: 'lint'
    entrypoint: 'yarn'
    args: ['lint']
    dir: 'frontend'

  # 3. Unit Tests
  #    canvas runtime libs needed for visual-regression tests (the compiled
  #    .node addon from step 1 links against cairo/pango shared libs).
  - name: 'node:26-alpine'
    id: 'test'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        apk add --no-cache cairo pango libjpeg-turbo giflib librsvg \
        && yarn test:ci
    dir: 'frontend'
    # Without CI set, jest-image-snapshot silently WRITES a missing baseline
    # and passes, so a visual regression could never fail this pipeline.
    env: ['CI=true']

  # 4. Production Build (produces dist/)
  - name: 'node:26-alpine'
    id: 'build'
    entrypoint: 'yarn'
    args: ['build', '--mode', '${_ENV}']
    dir: 'frontend'
    # Read by `define` in vite.config.ts. Without it the bundle reports
    # itself as 'local' and nothing in the served page says which build it is.
    env: ['APP_VERSION=${_SHORT_SHA}']

  # 4b. Archive the hidden source maps, then leave them behind.
  #     vite emits them without a sourceMappingURL comment, so browsers never
  #     request them; .dockerignore keeps them out of the image. Archiving is
  #     what makes them useful — without a copy keyed by version, a minified
  #     production stack trace stays unreadable.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:583.0.0'
    id: 'archive-sourcemaps'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -z "${_SOURCEMAP_BUCKET}" ]; then
          echo "No _SOURCEMAP_BUCKET set; source maps built but not archived."
          exit 0
        fi
        gcloud storage cp frontend/dist/assets/*.map \
          "gs://${_SOURCEMAP_BUCKET}/frontend/${_ENV}/${_SHORT_SHA}/"
        echo "Archived to gs://${_SOURCEMAP_BUCKET}/frontend/${_ENV}/${_SHORT_SHA}/"

  # 5. Docker Build + Push (registry layer cache)
  #    Kaniko was archived upstream; this uses the maintained Cloud Build
  #    docker builder, seeding the cache from the previous env image.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-push-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/f1v-repo/frontend"

        # A cold cache is not an error on the first build.
        docker pull "$$IMAGE:latest-${_ENV}" || true

        docker build \
          --cache-from "$$IMAGE:latest-${_ENV}" \
          -f /workspace/frontend/Dockerfile.ci \
          -t "$$IMAGE:${_SHORT_SHA}" \
          -t "$$IMAGE:latest-${_ENV}" \
          /workspace/frontend

        docker push "$$IMAGE:${_SHORT_SHA}"
        docker push "$$IMAGE:latest-${_ENV}"

  # 6. Deploy to Cloud Run (immutable SHA tag)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:583.0.0'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'f1v-webapp-${_ENV}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/f1v-repo/frontend:${_SHORT_SHA}'
      - '--region=${_REGION}'
      - '--project=$PROJECT_ID'
      - '--quiet'
