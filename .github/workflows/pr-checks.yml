# ==========================================
# PR Checks — Lint, Test, and Plan on Pull Requests
# ==========================================
# Runs on every PR targeting main. Three independent jobs
# execute in parallel: backend tests, frontend lint+test,
# and infrastructure plan.
# ==========================================
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------
  # Backend: Compile + Test all modules
  # -----------------------------------------
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: mvn clean package -am

  # -----------------------------------------
  # Frontend: Lint + Test
  # -----------------------------------------
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # --frozen-lockfile guarantees reproducibility, not safety: nothing here
      # failed on a newly published advisory. Currently 0 across 764 packages,
      # so this gate goes on while it is free rather than after it is not.
      - name: Dependency audit
        run: |
          set +e
          yarn audit --level high
          code=$?
          set -e
          # yarn 1 exits with a bitmask of the severities it found:
          # 1 INFO, 2 LOW, 4 MODERATE, 8 HIGH, 16 CRITICAL. Fail on high and
          # critical (8|16 = 24) and let the rest through as a report, so a
          # low-severity advisory in a dev dependency cannot block every PR.
          if [ $((code & 24)) -ne 0 ]; then
            echo "::error::High or critical advisories found - see the audit output above"
            exit 1
          fi

      - name: Lint
        run: yarn lint

      # A type error used to merge green and only fail later in the deploy
      # pipeline, because `yarn lint` does not typecheck and nothing built.
      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:ci

      # Catches Vite/rolldown regressions that neither lint nor tests see.
      - name: Build
        run: yarn build --mode dev

      # Bundle budget: fails the PR if the gzipped output grows past the limit
      # in frontend/.size-limit.js.
      - name: Bundle size budget
        run: yarn size

  # -----------------------------------------
  # Infrastructure: Security Scan + Plan
  # -----------------------------------------
  infrastructure:
    name: Infrastructure Scan & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: '1.12.6'

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/modules
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Validate OpenTofu Modules
        run: |
          for dir in infrastructure/modules/*/; do
            echo "=== Validating $dir ==="
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" validate
          done
